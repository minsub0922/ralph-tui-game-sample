version: 1
project: tui-dino-game
tasks:
  - id: core-loop-and-jump
    title: 게임 상태와 점프 물리 (순수 로직)
    type: core
    depends_on: []
    completed: true
    description: >
      목표:
        src/core/ 에 터미널과 무관한 순수 게임 코어를 만든다.
        - src/core/types.ts: GameState, GameConfig, Input, GameStatus 타입 정의
        - src/core/rng.ts: 시드 기반 결정론적 난수 생성기 (mulberry32 등 32bit PRNG 직접 구현)
        - src/core/game.ts: createGame(config, seed) 와 step(state, input) -> state
        공룡은 groundY 위를 달리고, Input.Jump 를 받으면 위로 속도를 얻는다.
        매 tick 마다 중력이 적용되어 다시 지면으로 내려온다.
        체공 중(y > groundY) 받은 Jump 입력은 무시한다(더블 점프 없음).
        step 은 기존 state 를 변형하지 않고 새 state 를 반환한다.
        아직 장애물, 충돌, 점수는 없다. 상태는 항상 status: 'running' 이다.

      acceptance criteria:
        - src/core/ 의 어떤 파일도 process.stdout / process.stdin / node:fs 를 참조하지 않는다.
        - 지면에서 Jump 를 받으면 다음 tick 에 공룡의 y 가 groundY 보다 커진다.
        - 아무 입력 없이 충분한 tick 을 돌리면 공룡이 정확히 groundY 로 돌아오고 그 아래로 내려가지 않는다.
        - 체공 중 Jump 를 계속 눌러도 최고 높이가 1회 점프와 동일하다.
        - 같은 시드로 만든 두 게임에 같은 입력 시퀀스를 주면 최종 state 가 완전히 동일하다.
        - rng 는 같은 시드에 대해 항상 같은 수열을 낸다.
        - 위 항목들을 tests/core/game.test.ts, tests/core/rng.test.ts 에서 node:test 로 검증한다.

      검증 명령:
        npm run check
  - id: obstacles-and-scoring
    title: 장애물 생성, 충돌 판정, 점수 누적
    type: core
    depends_on:
      - core-loop-and-jump
    completed: true
    description: |
      목표:
        src/core/game.ts 를 확장해 게임을 실제로 "끝나는" 게임으로 만든다.
        - 장애물(선인장)이 화면 오른쪽 끝에서 생성되어 매 tick 왼쪽으로 이동한다.
        - 생성 간격은 config 의 최소/최대 간격 사이에서 rng 로 결정한다. 최소 간격은
          최대 점프 체공 시간을 넘길 수 있는 값이어야 한다(피할 수 없는 배치 금지).
        - 화면 왼쪽 밖으로 나간 장애물은 목록에서 제거한다.
        - 공룡 히트박스와 장애물 히트박스가 겹치면 status 를 'gameOver' 로 바꾼다.
        - 살아있는 동안 매 tick 점수가 오른다 (score = floor(tick / config.ticksPerPoint)).
        - status 가 'gameOver' 인 state 에 step 을 호출하면 state 가 변하지 않는다.

      acceptance criteria:
        - 점프하지 않고 방치하면 반드시 유한한 tick 안에 status 가 'gameOver' 가 된다.
        - 장애물 바로 위를 지나가도록 타이밍을 맞춰 점프하면 충돌 없이 통과한다.
        - 충돌 직전/직후 경계 좌표에 대한 히트박스 테스트가 있다 (닿기 직전은 running, 겹치면 gameOver).
        - 어떤 두 장애물의 간격도 config.minGap 이상이다 (1000 tick 이상 돌려 검증).
        - gameOver 상태에서 step 을 100회 호출해도 score 와 status 가 그대로다.
        - 같은 시드는 항상 같은 장애물 배치를 만든다.
        - tests/core/obstacles.test.ts 에서 검증한다.

      검증 명령:
        npm run check
  - id: difficulty-presets
    title: 난이도 3단계 프리셋
    type: core
    depends_on:
      - obstacles-and-scoring
    completed: true
    description: |
      목표:
        src/core/difficulty.ts 에 slow / normal / fast 세 가지 GameConfig 프리셋을 정의한다.
        난이도가 올라갈수록 장애물 이동 속도가 빨라지고 생성 간격이 좁아진다.
        DIFFICULTY_IDS 배열과 getConfig(id) 를 export 하고, 잘못된 id 에는 명확한 에러를 던진다.
        각 프리셋은 tickMs(프레임 간격), obstacleSpeed, minGap, maxGap, ticksPerPoint,
        jumpVelocity, gravity 를 포함한다.

      acceptance criteria:
        - DIFFICULTY_IDS 는 ['slow', 'normal', 'fast'] 이다.
        - 세 프리셋 모두에서 "최대 점프 체공 거리 > 장애물 폭" 이 성립한다 — 즉 물리적으로 회피 가능하다.
        - obstacleSpeed 는 slow < normal < fast 순으로 엄격히 증가한다.
        - minGap 은 slow > normal > fast 순으로 감소하되, 각 난이도에서 회피 가능 최소 간격보다 크다.
        - getConfig('nope') 는 유효한 id 목록을 담은 메시지와 함께 throw 한다.
        - tests/core/difficulty.test.ts 에서 세 난이도를 순회하며 위 불변식을 검증한다.

      검증 명령:
        npm run check
  - id: headless-sim
    title: 헤드리스 시뮬레이션 (관찰 가능한 결과)
    type: core
    depends_on:
      - difficulty-presets
    completed: true
    description: |
      목표:
        PRODUCT.md 의 Observable outcome 을 실제로 실행 가능하게 만든다.
        - src/sim/bot.ts: 현재 state 를 보고 다음 입력을 정하는 결정론적 자동 점프 봇.
          가장 가까운 장애물이 임계 거리 안에 들어오고 공룡이 지면에 있으면 Jump.
        - src/sim/run.ts: 난이도별로 고정 시드 게임을 목표 틱까지 돌리는 러너.
        - package.json 에 "sim" 스크립트 추가. 인자 없이 실행하면 slow/normal/fast 를 모두 돌린다.
          --difficulty, --seed, --ticks 로 개별 실행도 가능하다.
        - 각 판마다 한 줄로 난이도 / 시드 / 최종 점수 / 진행 틱 수 / 종료 사유를 출력한다.
        - 세 판 모두 목표 틱까지 생존하면 exit 0, 하나라도 죽거나 예외가 나면 exit 1.

      acceptance criteria:
        - npm run sim 이 3줄의 결과를 출력하고 exit code 0 으로 끝난다.
        - 봇이 죽도록 강제한 케이스(예: 봇 임계 거리를 0으로)에서는 exit code 1 이 된다.
        - 같은 시드로 두 번 돌리면 출력이 문자 단위로 동일하다.
        - src/sim/ 은 렌더러나 터미널 코드를 import 하지 않는다.
        - tests/sim/run.test.ts 에서 러너를 함수로 직접 호출해 세 난이도 완주를 검증한다.

      검증 명령:
        npm run check && npm run sim; echo "exit=$?"
  - id: pure-renderer
    title: 순수 렌더러 (state -> 화면 문자열)
    type: core
    depends_on:
      - headless-sim
    completed: true
    description: >
      목표:
        src/ui/render.ts 에 renderFrame(state, viewport) -> string[] 순수 함수를 만든다.
        - 상단 HUD 한 줄: 난이도, 현재 점수, 최고 점수
        - 본문: 하늘 / 공룡(ASCII) / 선인장(ASCII) / 지면 라인
        - 반환은 화면 폭에 맞춰 잘린 고정 길이 문자열 배열이며, 어떤 I/O 도 하지 않는다.
        - status 가 'gameOver' 이면 화면 중앙에 게임 오버 박스를 오버레이한다
          (최종 점수 / 최고 기록 / 신기록 여부 / R = 다시하기, Q = 종료).

      acceptance criteria:
        - renderFrame 은 항상 viewport.height 개의 줄을 반환하고, 각 줄 길이는 정확히 viewport.width 다.
        - 공룡과 장애물이 좌표에 맞는 행/열에 그려진다 (특정 state 로 스냅샷 비교).
        - 화면 경계를 넘는 좌표의 장애물이 있어도 예외 없이 잘려서 렌더된다.
        - gameOver state 를 렌더하면 반환 문자열에 'GAME OVER' 와 'R' / 'Q' 안내가 포함된다.
        - render.ts 는 process 나 node:fs 를 참조하지 않는다.
        - tests/ui/render.test.ts 에서 검증한다.

      검증 명령:
        npm run check
  - id: terminal-app
    title: 터미널 실행 (난이도 메뉴 + 게임 루프 + 안전한 종료)
    type: core
    depends_on:
      - pure-renderer
    completed: true
    description: |
      목표:
        실제로 npm start 로 플레이 가능한 상태를 만든다.
        - src/ui/terminal.ts: raw mode 진입/복구, 커서 숨김/복구, 화면 그리기, 최소 크기 검사.
        - src/ui/menu.ts: 난이도 선택 화면. 1/2/3 또는 위아래 방향키 + Enter 로 선택.
        - src/index.ts: 메뉴 -> 게임 루프(setInterval, config.tickMs) -> 종료.
        - 스페이스는 Jump, Q 와 Ctrl+C 는 종료.
        - 터미널이 60x16 미만이면 안내 문구를 출력하고 exit 1.
        - 종료 경로(정상 종료 / Ctrl+C / 예외)에서 반드시 raw mode 와 커서를 복구한다.

      acceptance criteria:
        - npm start 로 메뉴가 뜨고, 난이도를 고르면 게임이 시작되며, 스페이스로 점프한다.
        - Q 를 누르면 종료 후 터미널에서 입력 에코와 커서가 정상으로 돌아온다.
        - Ctrl+C 로 종료해도 터미널 상태가 복구된다.
        - 키 입력 바이트를 Input 으로 바꾸는 순수 함수 parseKey(bytes) 를 분리하고,
          스페이스 / q / Ctrl+C / 방향키 / Enter / 무시 대상 키에 대해 테스트한다.
        - 렌더 결과를 실제로 stdout 에 쓰는 코드는 terminal.ts 한 곳에만 있다.
        - tests/ui/keys.test.ts 에서 parseKey 를 검증한다.

      검증 명령:
        npm run check && npm start
        (수동 확인: 메뉴 -> 스페이스 점프 -> Q 종료 후 터미널 정상 복구)
  - id: gameover-restart-and-highscore
    title: 게임 오버 처리, R 재시작, 난이도별 최고 기록 저장
    type: core
    depends_on:
      - terminal-app
    completed: true
    description: |
      목표:
        한 판이 끝난 뒤의 흐름을 완성한다.
        - src/core/score.ts: 난이도별 최고 기록의 순수 병합 로직
          mergeHighScores(current, difficulty, score) -> { scores, isNewRecord }
        - src/store/highscore.ts: ~/.tui-dino/scores.json 읽기/쓰기.
          파일이 없거나 JSON 이 깨졌으면 빈 기록으로 시작하고 크래시하지 않는다.
          쓰기는 임시 파일에 쓴 뒤 rename 하여 중간에 죽어도 파일이 깨지지 않게 한다.
        - 게임 오버 시 기록을 저장하고, 게임 오버 패널에 최고 기록과 신기록 여부를 표시한다.
        - R 을 누르면 같은 난이도로 즉시 새 판을 시작한다 (메뉴로 돌아가지 않는다).
        - HUD 의 최고 점수는 현재 난이도의 기록을 보여준다.

      acceptance criteria:
        - 점수가 기존 기록보다 높을 때만 isNewRecord 가 true 이고 기록이 갱신된다.
        - 난이도별 기록이 서로 독립적이다 (fast 기록이 slow 기록을 덮어쓰지 않는다).
        - 손상된 JSON 파일을 읽어도 예외 없이 빈 기록으로 동작한다.
        - 저장 후 다시 읽으면 같은 값이 나온다 (임시 디렉터리를 써서 테스트, 실제 홈 디렉터리 오염 금지).
        - 게임 오버 후 R 로 재시작하면 점수가 0 에서 다시 시작하고 난이도는 유지된다.
        - tests/core/score.test.ts 와 tests/store/highscore.test.ts 에서 검증한다.

      검증 명령:
        npm run check && npm run sim; echo "exit=$?"
  - id: progressive-speed-ramp
    title: (stretch) 판이 진행될수록 속도 상승
    type: stretch
    depends_on:
      - gameover-restart-and-highscore
    completed: true
    description: |
      목표:
        한 판 안에서 시간이 지날수록 장애물 속도가 서서히 올라가게 한다.
        config 에 speedRampPerTick 과 maxSpeedMultiplier 를 추가하고, 배속 상한을 둔다.
        기존 난이도 프리셋의 시작 속도는 바꾸지 않는다.

      acceptance criteria:
        - 2000 tick 시점의 실효 속도가 0 tick 시점보다 크고, maxSpeedMultiplier 를 넘지 않는다.
        - 속도가 올라가도 회피 가능 최소 간격 불변식이 계속 성립한다.
        - npm run sim 이 세 난이도 모두에서 여전히 완주한다 (봇 임계 거리를 속도에 비례시킨다).
        - 기존 테스트를 수정하거나 약화하지 않는다.

      검증 명령:
        npm run check && npm run sim; echo "exit=$?"
  - id: replay-record-and-verify
    title: (stretch) 리플레이 기록 및 재생 검증
    type: stretch
    depends_on:
      - progressive-speed-ramp
    completed: true
    description: |
      목표:
        한 판의 시드와 입력 시퀀스를 기록해 두었다가 그대로 재생해 같은 결과가 나오는지 확인한다.
        --record <path> 로 시뮬레이션 결과를 JSON 으로 저장하고,
        --replay <path> 로 그 파일을 재생해 최종 점수와 틱 수를 비교한다.
        불일치하면 어떤 tick 에서 갈라졌는지 출력하고 exit 1.

      acceptance criteria:
        - record 로 만든 파일을 replay 하면 최종 점수와 틱 수가 정확히 일치하고 exit 0 이다.
        - 파일의 시드를 손으로 바꾸면 불일치를 감지하고 exit 1 이 된다.
        - 리플레이 파일은 사람이 읽을 수 있는 JSON 이다 (version, difficulty, seed, inputs).
        - tests/sim/replay.test.ts 에서 record -> replay 왕복을 검증한다.

      검증 명령:
        npm run check && npm run sim; echo "exit=$?"
